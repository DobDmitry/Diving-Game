<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Вышка 10 м</title>
<style>
:root{--ink:#0B2545;--mut:#5B7089;--line:#D8E4EF;--blue:#378ADD;--deep:#185FA5;--pale:#EAF3FB;--coral:#D85A30;--ok:#0F6E56;--okbg:#E1F5EE;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:"Segoe UI",system-ui,sans-serif;background:#F5F9FD;color:var(--ink);display:flex;justify-content:center;
 padding:calc(8px + env(safe-area-inset-top)) 10px calc(8px + env(safe-area-inset-bottom));
 touch-action:manipulation;-webkit-user-select:none;user-select:none;
 -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.wrap{width:100%;max-width:460px;height:100%;display:flex;flex-direction:column;gap:6px}
.head{display:flex;align-items:baseline;gap:8px}
h1{font-size:17px;font-weight:600;white-space:nowrap}
.sub{font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden}
.tools{margin-left:auto;display:flex;gap:4px}
.tools button{padding:4px 7px;font-size:11px;border-radius:7px}
.row{display:flex;flex-wrap:wrap;gap:5px}
button{font-family:inherit;font-size:12px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent;white-space:nowrap}
button.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
button.on{background:var(--pale);border-color:#AFCDE8;color:var(--deep);font-weight:600}
button:disabled{opacity:.42;cursor:default}
.seg button{border-radius:0;border-left-width:0}
.seg button:first-child{border-radius:8px 0 0 8px;border-left-width:1px}
.seg button:last-child{border-radius:0 8px 8px 0}
.info{display:flex;align-items:center;gap:7px;font-size:12px;flex-wrap:nowrap;overflow:hidden;white-space:nowrap}
.info>span:first-child{overflow:hidden;text-overflow:ellipsis}
.dd{background:var(--pale);color:var(--deep);padding:2px 8px;border-radius:8px;font-size:11.5px;font-weight:600;flex:none}
.best{margin-left:auto;color:var(--mut);font-size:11.5px;flex:none}
.bar{height:14px;border-radius:7px;position:relative;overflow:hidden;display:flex;flex:none}
.z{height:100%}
#pwr{position:absolute;top:0;bottom:0;width:4px;background:#0B2545;left:0;border-radius:2px}
#cvWrap{flex:1;min-height:120px;position:relative}
canvas{width:100%;height:100%;display:block;border:1px solid var(--line);border-radius:14px;touch-action:none;background:#F0F6FC}
#ovl{position:absolute;left:8px;right:8px;bottom:8px;max-height:calc(100% - 16px);overflow:auto;
 background:rgba(255,255,255,0.94);border:1px solid var(--line);
 border-radius:12px;padding:8px 10px;display:none;backdrop-filter:blur(3px);box-shadow:0 4px 14px rgba(11,37,69,.10)}
.otop{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
#ovlTotal{font-size:24px;font-weight:700;line-height:1}
.otop .lab{font-size:11.5px;color:var(--mut)}
#judges{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 4px}
.jsc{padding:4px 7px;border-radius:7px;font-size:12.5px;font-weight:600;background:var(--okbg);color:var(--ok)}
.jsc.drop{background:#EEF2F6;color:#9AA8B8;text-decoration:line-through}
.jsc.zero{background:#F9E3E3;color:#A33}
#ded{font-size:11.5px;color:var(--mut);display:flex;flex-direction:column;gap:1px;margin-bottom:4px}
#ded .d{display:flex;gap:6px}
#ded .d b{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
#ded .neg b{color:#A33}
#ded .pos b{color:var(--ok)}
#verdict{font-size:11.5px;color:var(--mut)}
#meetBox{display:none;margin-top:6px;border-top:1px solid var(--line);padding-top:6px;font-size:11.5px}
#meetBox .mr{display:flex;gap:8px;padding:1px 0}
#meetBox .mr b{margin-left:auto;font-variant-numeric:tabular-nums}
#actBtn{width:100%;font-weight:600;font-size:16px;padding:13px;background:var(--ink);color:#fff;border-color:var(--ink);border-radius:12px;flex:none}
#actBtn:active{transform:scale(0.985)}
.hint{font-size:11px;color:var(--mut);text-align:center;flex:none}
.recrow{display:flex;gap:4px;flex-wrap:nowrap;align-items:center;font-size:11.5px;color:var(--mut);flex:none;
 overflow-x:auto;scrollbar-width:none}
.recrow::-webkit-scrollbar{display:none}
.recrow>span{display:flex;gap:4px;flex-wrap:nowrap}
.chip{font-size:11px;padding:2px 7px;border-radius:7px;background:#EEF2F6;color:var(--mut);white-space:nowrap}
.chip.has{background:var(--pale);color:var(--deep);font-weight:600}
@media (max-width:420px){.sub{display:none}}
@media (max-height:700px){.recrow{display:none}}
@media (max-height:600px){.sub{display:none}h1{font-size:15px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>Вышка 10 метров</h1>
    <span class="sub">толчок · вращение · выход · вход</span>
    <span class="tools">
      <button id="hintBtn" title="Подсказки по раскрытию">Подсказки</button>
      <button id="sndBtn" title="Звук">Звук</button>
    </span>
  </div>
  <div class="row seg" id="modeBtns"></div>
  <div class="row" id="clsBtns"></div>
  <div class="row" id="diveBtns"></div>
  <div class="info">
    <span style="color:var(--mut)">Прыжок: <span id="diveName" style="color:var(--ink);font-weight:600"></span></span>
    <span class="dd">КТ <span id="ddLbl"></span></span>
    <span class="best" id="bestLbl">Лучший: —</span>
  </div>
  <div class="bar">
    <div class="z" style="width:17.4%;background:#8E2B3C"></div>
    <div class="z" style="width:14%;background:#E05252"></div>
    <div class="z" style="width:12%;background:#F5C244"></div>
    <div class="z" style="width:13.2%;background:#25B47E"></div>
    <div class="z" style="width:12%;background:#F5C244"></div>
    <div class="z" style="width:14%;background:#E05252"></div>
    <div class="z" style="width:17.4%;background:#8E2B3C"></div>
    <div id="pwr"></div>
  </div>
  <div id="cvWrap">
    <canvas id="cv"></canvas>
    <div id="ovl">
      <div class="otop">
        <span class="lab">Сумма трёх × КТ</span>
        <span id="ovlTotal">0.00</span>
        <span id="ovlExtra" class="lab"></span>
      </div>
      <div id="judges"></div>
      <div id="ded"></div>
      <div id="verdict"></div>
      <div id="meetBox"></div>
    </div>
  </div>
  <button id="actBtn">Начать прыжок</button>
  <div class="hint" id="hintTxt">Нажми, чтобы выйти на исходную</div>
  <div class="recrow">Рекорды:&nbsp;<span id="recRow"></span></div>
</div>
<script src="art.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id);

/* ============ таблица прыжков ============
   cls: 1 вперёд · 2 назад · 3 оборотные · 4 из задней стойки
   pk: 1 = согнувшись (B), 0 = группировка (C)
   dd — коэффициент трудности, лист «10 метров» официальной таблицы КТ
        (колонка B для положения «согнувшись», колонка C для «группировки») */
/* hk — множитель высоты выпрыгивания: 1 класс самый высокий, 2-й на 10% ниже, 3 и 4 — ещё на 10% */
const CLS={1:{f:1,dir:1,sty:"fw",hk:1.00},2:{f:-1,dir:1,sty:"bk",hk:0.90},
           3:{f:1,dir:-1,sty:"bk",hk:0.81},4:{f:-1,dir:-1,sty:"fw",hk:0.81}};
/* скорость крутки, об/с — задана на группу «класс × положение», от числа оборотов не зависит */
const REV={fwC:3.00,bkC:2.50,fwB:2.50,bkB:2.10};
const RAW=[
 ["105B",1,2.3,2.5,1,"2½ вперёд, согнувшись"],
 ["107B",1,3.0,3.5,1,"3½ вперёд, согнувшись"],
 ["107C",1,2.7,3.5,0,"3½ вперёд, в группировке"],
 ["109C",1,3.7,4.5,0,"4½ вперёд, в группировке"],
 ["205B",2,2.9,2.5,1,"2½ назад, согнувшись"],
 ["207B",2,3.6,3.5,1,"3½ назад, согнувшись"],
 ["207C",2,3.3,3.5,0,"3½ назад, в группировке"],
 ["209C",2,4.2,4.5,0,"4½ назад, в группировке"],
 ["305B",3,3.0,2.5,1,"2½ оборотных, согнувшись"],
 ["307C",3,3.4,3.5,0,"3½ оборотных, в группировке"],
 ["405B",4,2.8,2.5,1,"2½ из задней стойки, согнувшись"],
 ["407C",4,3.2,3.5,0,"3½ из задней стойки, в группировке"]
];
const dives=RAW.map(r=>Object.assign({num:r[0],cls:r[1],dd:r[2],req:r[3],pk:r[4],name:r[5]},CLS[r[1]]));
const idxOf=n=>dives.findIndex(d=>d.num===n);
/* произвольная программа финала — 6 прыжков */
const MEET_PROG=["107B","207C","307C","407C","109C","209C"];

/* ============ физика ============ */
const G=9.81,SIMK=0.62;
/* раскрытие: момент инерции растёт примерно в 2.6 раза, поэтому угловая скорость
   сразу падает до K_OPEN от «крутки», а дальше плавно затухает к W_END вплоть до воды */
const K_OPEN=0.38,TAU=0.30,W_END=12;
/* общий множитель высоты выпрыгивания */
const H_KICK=0.85;
/* высота (м), на которой спортсмен начинает выпрямляться в «стрелочку» */
const Y_LINE=3.0;
let H0=10.32,Tg=0;
/* зоны отталкивания: h — высота выпрыгивания, vx — уход от вышки, cap — потолок оценки, pen — базовый вычет */
const zones=[
 {d:0.066,nm:"зелёная",h:1.00,vx:26,cap:10,pen:0},
 {d:0.186,nm:"жёлтая",h:0.60,vx:20,cap:9,pen:0.5},
 {d:0.326,nm:"красная",h:0.30,vx:14,cap:7.5,pen:1.5},
 {d:1.00,nm:"бордовая",h:0.01,vx:8,cap:2,pen:3.0}
];


/* ============ мир и состояние ============ */
H0=10+(footBottom(POSES.line)-comOf(POSES.line)[1])/PXM;
/* сколько градусов даёт линия за время T после раскрытия (затухающее вращение) */
function lineRot(spd,T){
 return W_END*T+(spd*K_OPEN-W_END)*TAU*(1-Math.exp(-T/TAU));
}
/* скорость крутки задана таблицей REV; высота выхода из неё уже вытекает,
   поэтому решаем обратную задачу — в какой момент надо раскрыться */
{const flight=h=>{const v0=Math.sqrt(2*G*h);return (v0+Math.sqrt(v0*v0+2*G*(H0-0.15)))/G;};
 Tg=flight(H_KICK);
 dives.forEach(d=>{
  d.spd=REV[d.sty+(d.pk?"B":"C")]*360;
  d.yLine=Y_LINE;
  const hj=H_KICK*d.hk,T=flight(hj);
  let a=0,b=T;                                   /* бисекция по моменту раскрытия */
  for(let i=0;i<44;i++){const m=(a+b)/2;
   if(d.spd*m+lineRot(d.spd,T-m)<d.req*360)a=m;else b=m;}
  d.tFlight=T;d.tOpen=(a+b)/2;d.tLineIdeal=T-d.tOpen;
  const v0=Math.sqrt(2*G*hj);
  d.yOpen=H0+v0*d.tOpen-G*d.tOpen*d.tOpen/2;
 });
 /* 4½ назад раскрывается ниже общей отметки — для него вход опущен */
 dives[idxOf("209C")].yLine=2.0;}

const T_CLOSE_DUR=0.18;   /* длительность самого выпрямления, с анимации:
                             у 209C от отметки 2 м до воды всего ~0.22 с, должно успевать */
const RIP_OPEN=3.0;                       /* с какой высоты (м) открыто окно «входа» */
let recs={},best=null,bestMeet=null,hints=true,snd=true;
let sel=idxOf("107B"),curCls=1,mode="train";
let meetIdx=0,meetRows=[],meetDone=false;
let state="idle",pwrT=0,zone=null,isDown=false;
let y=0,vy=0,rot=0,tucked=false,opened=false,x0=128,vx=0,tF=0,tGlob=0;
let armsClosed=true,lineupT=0,tLine=0,entryX=210,entryAng=0,uwT=0;
let ripUsed=false,ripQ=0,ripFlash=0;
let drops=[],rings=[],jets=[],bubbles=[],foam=[],crown=[];
const CARD_T=4.2;let cardT=0,cardScores=[],slow=1,shake=0;
let prepQ=[],prepIdx=0;
let lastRes=null;

/* ============ сохранение ============ */
const LS="diving10m_v11";
function save(){try{localStorage.setItem(LS,JSON.stringify({recs,best,bestMeet,hints,snd}));}catch(e){}}
function load(){try{const o=JSON.parse(localStorage.getItem(LS)||"{}");
 recs=o.recs||{};best=o.best!=null?o.best:null;bestMeet=o.bestMeet!=null?o.bestMeet:null;
 if(o.hints!=null)hints=!!o.hints;if(o.snd!=null)snd=!!o.snd;}catch(e){}}
load();

/* ============ звук ============ */
let AC=null;
function ac(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C();}
 if(AC&&AC.state==="suspended")AC.resume();return AC;}
function noiseBuf(a,sec){const n=Math.floor(a.sampleRate*sec),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
 let v=0;for(let i=0;i<n;i++){v=v*0.72+(Math.random()*2-1)*0.28;d[i]=v*2.6;}return b;}
/* общая шина: срез верха + мягкая компрессия — ничего не «щёлкает» и не режет ухо */
let MBUS=null;
function bus(a){
 if(!MBUS){
  const g=a.createGain();g.gain.value=0.9;
  const lp=a.createBiquadFilter();lp.type="lowpass";lp.frequency.value=4200;lp.Q.value=0.2;
  const hs=a.createBiquadFilter();hs.type="highshelf";hs.frequency.value=2200;hs.gain.value=-8;
  let out=lp;g.connect(lp);lp.connect(hs);out=hs;
  if(a.createDynamicsCompressor){const c=a.createDynamicsCompressor();
   c.threshold.value=-26;c.knee.value=26;c.ratio.value=3.5;c.attack.value=0.02;c.release.value=0.35;
   hs.connect(c);out=c;}
  out.connect(a.destination);MBUS=g;}
 return MBUS;
}
/* плавная огибающая: без мгновенных атак */
function env(g,t,peak,att,dec){
 g.gain.setValueAtTime(0.0001,t);
 g.gain.linearRampToValueAtTime(peak,t+att);
 g.gain.exponentialRampToValueAtTime(0.0001,t+att+dec);
}
function sfxSplash(power){const a=snd&&ac();if(!a)return;const t=a.currentTime;
 const s=a.createBufferSource();s.buffer=noiseBuf(a,1.3);
 const f=a.createBiquadFilter();f.type="lowpass";
 f.frequency.setValueAtTime(320+power*900,t);
 f.frequency.exponentialRampToValueAtTime(130,t+0.85);
 f.Q.value=0.35;
 const g=a.createGain();env(g,t,0.028+0.10*power,0.055,0.9);
 s.connect(f);f.connect(g);g.connect(bus(a));s.start(t);s.stop(t+1.3);}
function sfxTone(fr,dur,vol,type){const a=snd&&ac();if(!a)return;const t=a.currentTime;
 const o=a.createOscillator(),g=a.createGain(),f=a.createBiquadFilter();
 f.type="lowpass";f.frequency.value=Math.max(600,fr*2.6);f.Q.value=0.3;
 o.type=type||"sine";o.frequency.setValueAtTime(fr,t);
 env(g,t,vol,Math.min(0.06,dur*0.4),dur);
 o.connect(f);f.connect(g);g.connect(bus(a));o.start(t);o.stop(t+dur+0.2);}
function sfxCheer(){const a=snd&&ac();if(!a)return;const t=a.currentTime;
 const s=a.createBufferSource();s.buffer=noiseBuf(a,2.2);
 const f=a.createBiquadFilter();f.type="bandpass";f.frequency.value=720;f.Q.value=0.45;
 const lp=a.createBiquadFilter();lp.type="lowpass";lp.frequency.value=1600;
 const g=a.createGain();
 g.gain.setValueAtTime(0.0001,t);
 g.gain.linearRampToValueAtTime(0.055,t+0.45);
 g.gain.linearRampToValueAtTime(0.0001,t+2.0);
 s.connect(f);f.connect(lp);lp.connect(g);g.connect(bus(a));s.start(t);s.stop(t+2.2);}
function buzz(ms){if(navigator.vibrate)try{navigator.vibrate(ms);}catch(e){}}

function curX(){return x0+14*(1-Math.exp(-tF/0.12))+vx*tF;}
function standX(){return dives[sel].f===-1?137:128;}
/* сколько ещё градусов «лишних» относительно идеального момента выхода */
function openErr(){
 const d=dives[sel],need=d.req*360-rot;
 const disc=vy*vy+2*G*(y-0.15);
 const tRem=disc>0?(vy+Math.sqrt(disc))/G:0;
 return need-lineRot(d.spd,tRem);
}

/* ============ цикл ============ */
let last=0;
function loop(ts){
 const dt=Math.min(0.033,(ts-last)/1000);last=ts;tGlob+=dt;
 /* слоу-мо на подлёте и первые мгновения под водой */
 let want=1;
 if(state==="flight"&&y<1.6&&opened)want=0.4;
 if(state==="entry"&&uwT<0.55)want=0.45;
 slow+=(want-slow)*(1-Math.exp(-dt/0.08));
 const dts=dt*slow;
 tickPose(dts);
 if(shake>0)shake=Math.max(0,shake-dt*40);
 if(ripFlash>0)ripFlash-=dt;

 /* выпрямление в «стрелочку» начинается на фиксированной высоте, а не через фикс. время */
 if(state==="flight"&&!tucked&&!armsClosed&&y<=dives[sel].yLine){
  armsClosed=true;lineupT=0;setPose(POSES.line,T_CLOSE_DUR,CLOSE_ST);
 }
 if(state==="flight"&&opened&&armsClosed)lineupT+=dts;
 if(state==="armed"){pwrT+=dt*1.6;const ph=(Math.sin(pwrT*Math.PI)+1)/2;
  $("pwr").style.left="calc("+(ph*100)+"% - 2px)";}
 if(state==="prep"&&!trans){
  prepIdx++;
  if(prepIdx<prepQ.length)setPose(prepQ[prepIdx][0],prepQ[prepIdx][1]);
  else launch();
 }
 if(state==="flight"){
  const s=dts*SIMK;tF+=s;
  vy-=G*s;y+=vy*s;
  rot+=(tucked?dives[sel].spd:W_END+(dives[sel].spd*K_OPEN-W_END)*Math.exp(-tLine/TAU))*s;
  if(!tucked)tLine+=s;
  if(y<=0.15)enterWater();
 }else if(state==="entry"){
  const s=dts*SIMK;uwT+=dts;
  vy*=Math.max(0,1-2.6*s);y+=vy*s;
  if(uwT>0.35&&Math.random()<0.35)bubbles.push({x:entryX+(Math.random()-0.5)*14,y:m2y(y)+Math.random()*10,r:1+Math.random()*2.4,a:0.7,v:0.6+Math.random()*0.9});
  if(uwT>1.15){state="score";showResult();}
 }
 /* частицы живут в игровом времени: в слоу-мо брызги тоже замедляются */
 const kp=dts*60;
 drops.forEach(p=>{p.vy+=0.30*kp;p.vx*=Math.pow(0.995,kp);p.x+=p.vx*kp;p.y+=p.vy*kp;
  p.a-=(p.y>WY-1&&p.vy>0?0.20:0.012)*kp;});
 drops=drops.filter(p=>p.a>0);
 foam.forEach(f=>{f.t+=dts;f.r+=(f.rm-f.r)*(1-Math.pow(0.91,kp));f.a-=0.014*kp;});
 foam=foam.filter(f=>f.a>0);
 crown.forEach(c=>c.t+=dts);crown=crown.filter(c=>c.t<c.dur);
 rings.forEach(g=>{g.r+=(g.v||1.1)*kp;g.a-=0.011*kp;});rings=rings.filter(g=>g.a>0);
 jets.forEach(j=>{j.h+=j.v*kp;j.v-=0.42*kp;});jets=jets.filter(j=>j.h>2);
 bubbles.forEach(b=>{b.y-=b.v*kp;b.x+=Math.sin(b.y*0.12)*0.25*kp;b.a-=0.012*kp;});
 bubbles=bubbles.filter(b=>b.a>0&&b.y>WY);
 if(cardT>0)cardT-=dt;
 const[tcx,tcy,tz]=camTarget();
 const k=1-Math.exp(-dt/0.22);
 cam.z+=(tz-cam.z)*k;
 const a2=view.s*cam.z,vw=cv.width/a2,vh=cv.height/a2;
 let ncx=tcx,ncy=tcy;
 if(vw<W+160)ncx=clamp(ncx,-80+vw/2,W+80-vw/2);else ncx=W/2;
 if(vh<H+100)ncy=clamp(ncy,-60+vh/2,H+40-vh/2);else ncy=H/2;
 cam.cx+=(ncx-cam.cx)*k;cam.cy+=(ncy-cam.cy)*k;
 draw();requestAnimationFrame(loop);
}

/* ============ ход прыжка ============ */
function pickZone(){
 const ph=(Math.sin(pwrT*Math.PI)+1)/2,dd=Math.abs(ph-0.5);
 for(const z of zones)if(dd<=z.d)return z;
 return zones[3];
}
function startPrep(){
 const d=dives[sel];
 /* 1 и 4 класс — резкий короткий толчок со стопы, руки уже сверху, замаха нет;
    2 и 3 класс — привычный подсед из задней стойки */
 prepQ=d.sty==="fw"
  ?[[POSES.hopFw,0.12],[POSES.line,0.14]]
  :[[POSES.squatBk,0.28],[POSES.line,0.28]];
 if(d.f===-1){/* стойка спиной: подъём на носки перед толчком */
  const armed=d.sty==="fw"?POSES.armsUpFw:POSES.armsFwdBk;
  prepQ.unshift([Object.assign({},armed,{ank:36,head:-2}),d.sty==="fw"?0.13:0.22]);
 }
 prepIdx=0;setPose(prepQ[0][0],prepQ[0][1]);state="prep";
}
function launch(){
 const z=zone;
 y=H0;vy=Math.sqrt(2*G*z.h*H_KICK*dives[sel].hk);   /* высота выпрыгивания: зона × общий множитель × класс */
 x0=standX();vx=z.vx;tF=0;
 rot=0;tucked=isDown;opened=false;armsClosed=true;lineupT=0;tLine=0;
 ripUsed=false;ripQ=0;
 if(tucked)setPose(dives[sel].pk?POSES.pike:POSES.tuck,0.2,TUCK_ST);
 else setPose(POSES.line,0.22);
 state="flight";
 sfxTone(120,0.34,0.06,"sine");buzz(12);
 $("actBtn").textContent="Держи — вращение";
 $("hintTxt").textContent="Держи кнопку — группировка. Отпусти — раскрытие. Ещё касание у воды — вход без брызг.";
}
function enterWater(){
 entryX=curX();entryAng=dives[sel].dir*rot*R;
 state="entry";uwT=0;
 grade();
}
function grade(){
 const d=dives[sel],target=d.req*360,err=Math.abs(target-rot);
 const over=rot>target;
 const failed=err>90;
 /* --- вычеты --- */
 const ded=[],rotPen=err/10;
 let pen=zone.pen+rotPen,bonus=0;
 if(failed){
  ded.push(["Отталкивание · "+zone.nm+" зона",-zone.pen]);
  ded.push([(over?"Перекрут ":"Недокрут ")+err.toFixed(0)+"° — тело не в вертикали",0]);
  if(tucked)ded.push(["Вход в группировке",0]);
 }else{
  ded.push(["Отталкивание · "+zone.nm+" зона",-zone.pen]);
  ded.push(["Вращение · "+(over?"перекрут ":"недокрут ")+err.toFixed(0)+"°",-rotPen]);
  if(tucked){ded.push(["Вход в группировке — грубая ошибка",-2.0]);pen+=2.0;}
  else{
   /* выпрямление начинается на фиксированной высоте; штрафуем, если выход был так низко,
      что «стрелочка» не успела сложиться до касания воды */
   const lineup=armsClosed?clamp(lineupT/T_CLOSE_DUR,0,1):0;
   if(lineup<0.98){const p=(1-lineup)*1.4;
    ded.push(["Слишком низкий выход — не успел выпрямиться",-p]);pen+=p;}
   /* верхней границы нет: при фиксированной крутке у 2½ и 3½ линия длинная по построению */
   if(tLine<0.12){const p=Math.min(1.4,(0.12-tLine)/0.12*1.6);ded.push(["Поздний выход — короткая линия",-p]);pen+=p;}
  }
  /* вход: базовый вычет 0.55, который снимается точным «рипом» */
  const ep=0.55*(1-ripQ);pen+=ep;
  ded.push([ripQ>0.85?"Вход без брызг":ripQ>0.15?"Вход · немного брызг":ripUsed?"Вход · мимо окна, брызги":"Вход · брызги",ep<0.06?0:-ep]);
 }
 /* потолок 9.9 до судейских поправок — «десятки» остаются редкими */
 const base=clamp(10-pen+bonus,0,Math.min(zone.cap,9.9));

 /* --- брызги --- */
 const sp=clamp(err/70+(tucked?0.6:0)-ripQ*0.55,0.05,1.6);
 spawnSplash(entryX,sp);
 shake=Math.min(7,1+sp*5);
 sfxSplash(clamp(sp/1.6,0.05,1));buzz(sp>0.8?[18,40,26]:14);

 /* --- судьи --- */
 let js=[];
 if(failed)js=[0,0,0,0,0,0,0];
 else judges.forEach(j=>{
  let s=base+j.b+(Math.random()-0.5)*0.4;
  js.push(Math.round(clamp(s,0,10)*2)/2);});
 cardScores=js;cardT=CARD_T;
 const sorted=[...js].sort((a,b)=>a-b),mid=sorted.slice(2,5);
 const sum3=mid.reduce((a,b)=>a+b,0),total=sum3*d.dd,avg=sum3/3;
 const drop=new Set();
 sorted.slice(0,2).concat(sorted.slice(5)).forEach(v=>{
  for(let i=0;i<js.length;i++){if(js[i]===v&&!drop.has(i)){drop.add(i);break;}}});
 let v;
 if(failed)v="Отклонение входа больше 90° — прыжок не засчитан, 0 баллов";
 else if(avg>=9)v="Безупречно — уровень финала Игр";
 else if(avg>=7.5)v="Очень достойно — полуфинал обеспечен";
 else if(avg>=5.5)v="Средне: ошибку видно с трибуны";
 else v="Тренер уже пишет план дополнительных УТМ";
 if(avg>=8)sfxCheer();
 lastRes={js,drop,total,avg,ded,failed,verdict:v,dd:d.dd,num:d.num};
}
function showResult(){
 const r=lastRes,d=dives[sel];
 $("ovlTotal").textContent=r.total.toFixed(2);
 $("ovlExtra").textContent=r.num+" · КТ "+r.dd.toFixed(1);
 const jb=$("judges");jb.innerHTML="";
 r.js.forEach((s,i)=>{const el=document.createElement("div");
  el.className="jsc"+(r.drop.has(i)?" drop":"")+(r.failed?" zero":"");
  el.textContent=s.toFixed(1);jb.appendChild(el);});
 const db=$("ded");db.innerHTML="";
 r.ded.forEach(p=>{const el=document.createElement("div");
  const v=Math.abs(p[1])<0.05?0:p[1];
  el.className="d"+(v<0?" neg":v>0?" pos":"");
  el.innerHTML="<span>"+p[0]+"</span><b>"+(v===0?"—":(v>0?"+":"")+v.toFixed(1))+"</b>";
  db.appendChild(el);});
 $("verdict").textContent=r.verdict;
 let newRec=false;
 if(r.total>0&&(!recs[d.num]||r.total>recs[d.num])){if(recs[d.num])newRec=true;recs[d.num]=r.total;renderRecs();}
 if(r.total>0&&(best===null||r.total>best))best=r.total;
 if(newRec)$("verdict").textContent="Новый рекорд прыжка! "+r.verdict;
 if(mode==="meet"){
  meetRows.push({num:d.num,dd:d.dd,total:r.total});
  meetDone=meetRows.length>=MEET_PROG.length;
  renderMeet();syncDiveUI();
 }else $("meetBox").style.display="none";
 save();updateInfo();
 $("ovl").style.display="block";
 $("actBtn").textContent=mode==="meet"?(meetDone?"Новая серия":"Прыжок "+(meetRows.length+1)+" из "+MEET_PROG.length):"Ещё попытка";
 $("hintTxt").textContent="Нажми, чтобы выйти на исходную";
 setTimeout(()=>{if(state==="score"){trans=null;poseCur=Object.assign({},POSES.stand);state="idle";}},400);
}
function renderMeet(){
 const b=$("meetBox");b.style.display="block";b.innerHTML="";
 let sum=0;
 meetRows.forEach((m,i)=>{sum+=m.total;
  const el=document.createElement("div");el.className="mr";
  el.innerHTML="<span>"+(i+1)+". "+m.num+" · КТ "+m.dd.toFixed(1)+"</span><b>"+m.total.toFixed(2)+"</b>";
  b.appendChild(el);});
 const el=document.createElement("div");el.className="mr";el.style.marginTop="3px";
 el.innerHTML="<span style='font-weight:600;color:var(--ink)'>"+(meetDone?"Итог серии":"Сумма после "+meetRows.length)+"</span><b style='color:var(--ink);font-size:13px'>"+sum.toFixed(2)+"</b>";
 b.appendChild(el);
 if(meetDone){
  if(bestMeet===null||sum>bestMeet)bestMeet=sum;
  const v=document.createElement("div");v.style.marginTop="3px";v.style.color="var(--mut)";
  v.textContent=sum>=560?"Уровень призёра Игр":sum>=500?"Финал чемпионата мира":sum>=420?"Уверенный полуфинал":"Есть над чем работать";
  b.appendChild(v);
 }
}

/* ============ управление ============ */
function press(){
 isDown=true;
 if(state==="idle"){
  if(mode==="meet"){
   if(meetDone){meetRows=[];meetDone=false;meetIdx=0;}
   else meetIdx=meetRows.length;
   sel=idxOf(MEET_PROG[Math.min(meetIdx,MEET_PROG.length-1)]);
   syncDiveUI();
  }
  state="armed";pwrT=0;
  setPose(dives[sel].sty==="fw"?POSES.armsUpFw:POSES.armsFwdBk,0.24);
  $("ovl").style.display="none";
  $("actBtn").textContent="Жми! Отталкивание";
  $("hintTxt").textContent="Второе нажатие — отталкивание. Целься в зелёную зону.";
  ac();
 }else if(state==="armed"){
  zone=pickZone();
  sfxTone(zone.pen===0?520:310,0.22,0.045,"sine");
  startPrep();
 }else if(state==="flight"){
  if(!tucked&&!opened){tucked=true;armsClosed=true;
   setPose(dives[sel].pk?POSES.pike:POSES.tuck,0.2,TUCK_ST);}
  else if(opened&&!ripUsed){
   ripUsed=true;
   ripQ=y<=RIP_OPEN?Math.pow(clamp(1-(y-0.15)/(RIP_OPEN-0.15),0,1),2):0;
   if(ripQ>0.15){sfxTone(620,0.26,0.04,"sine");ripFlash=0.3;}
  }
 }
}
function release(){
 isDown=false;
 if(state==="flight"&&tucked){tucked=false;opened=true;armsClosed=false;lineupT=0;
  /* 1 и 4 класс раскрываются в уголок руки в стороны, 2 и 3 — в «лодочку» руки вдоль тела;
     из складки на 2 и 3 классе ноги ведут движение, корпус откидывается за ними */
  const d=dives[sel];
  setPose(d.sty==="fw"?POSES.openFw:POSES.openBk,0.22,
          (d.sty==="bk"&&d.pk)?OPEN_ST_LEGS:OPEN_ST);
  sfxTone(340,0.24,0.035,"sine");
  $("actBtn").textContent="Вход!";}
}
const act=$("actBtn");
act.addEventListener("pointerdown",e=>{e.preventDefault();press();});
act.addEventListener("pointerup",e=>{e.preventDefault();release();});
act.addEventListener("pointercancel",()=>release());
cv.addEventListener("pointerdown",e=>{e.preventDefault();press();});
cv.addEventListener("pointerup",e=>{e.preventDefault();release();});
cv.addEventListener("pointercancel",()=>release());
document.addEventListener("keydown",e=>{if(e.code==="Space"&&!e.repeat){e.preventDefault();press();}});
document.addEventListener("keyup",e=>{if(e.code==="Space"){e.preventDefault();release();}});
document.addEventListener("contextmenu",e=>{if(e.target===cv||e.target===act)e.preventDefault();});

/* ============ UI ============ */
const modeBox=$("modeBtns"),clsBox=$("clsBtns"),diveBox=$("diveBtns");
[["train","Тренировка"],["meet","Соревнование · 6"]].forEach(m=>{
 const b=document.createElement("button");b.textContent=m[1];
 b.onclick=()=>{if(busy())return;mode=m[0];
  if(mode==="meet"){meetRows=[];meetDone=false;meetIdx=0;sel=idxOf(MEET_PROG[0]);}
  $("ovl").style.display="none";state="idle";syncDiveUI();updateInfo();};
 modeBox.appendChild(b);m.push(b);});
[1,2,3,4].forEach(c=>{
 const b=document.createElement("button");b.textContent="кл. "+c;
 b.onclick=()=>{if(busy()||mode==="meet")return;curCls=c;
  const first=dives.findIndex(d=>d.cls===c);if(first>=0)sel=first;
  syncDiveUI();updateInfo();};
 clsBox.appendChild(b);b.dataset.cls=c;});
function busy(){return state==="flight"||state==="prep"||state==="entry";}
function syncDiveUI(){
 curCls=dives[sel].cls;
 [...modeBox.children].forEach((b,i)=>b.className=(i===0?"train":"meet")===mode?"sel":"");
 clsBox.style.display=mode==="meet"?"none":"flex";
 [...clsBox.children].forEach(b=>{b.className=+b.dataset.cls===curCls?"sel":"";});
 diveBox.innerHTML="";
 const list=mode==="meet"?MEET_PROG.map(idxOf):dives.map((d,i)=>i).filter(i=>dives[i].cls===curCls);
 list.forEach((i,k)=>{
  const d=dives[i],b=document.createElement("button");
  const done=mode==="meet"&&k<meetRows.length&&!meetDone;
  b.textContent=mode==="meet"?(done?"✓ ":(k+1)+". ")+d.num:d.num;
  b.className=i===sel&&!done?"sel":done?"on":"";
  b.disabled=mode==="meet";
  b.onclick=()=>{if(busy())return;sel=i;state="idle";$("ovl").style.display="none";
   trans=null;poseCur=Object.assign({},POSES.stand);syncDiveUI();updateInfo();};
  diveBox.appendChild(b);});
}
function updateInfo(){
 const d=dives[sel];
 $("diveName").textContent=d.num+" — "+d.name;
 $("ddLbl").textContent=d.dd.toFixed(1);
 $("bestLbl").textContent=mode==="meet"
  ?("Прыжок "+Math.min(meetRows.length+1,MEET_PROG.length)+"/"+MEET_PROG.length+(bestMeet!=null?" · рек. "+bestMeet.toFixed(0):""))
  :("Лучший: "+(best!=null?best.toFixed(2):"—"));
 if(state==="idle")$("actBtn").textContent=mode==="meet"&&meetDone?"Новая серия":"Начать прыжок";
}
function renderRecs(){const r=$("recRow");r.innerHTML="";
 dives.forEach(d=>{const c=document.createElement("span");c.className="chip"+(recs[d.num]?" has":"");
 c.textContent=d.num+" "+(recs[d.num]?recs[d.num].toFixed(1):"—");r.appendChild(c);});}
$("hintBtn").onclick=()=>{hints=!hints;$("hintBtn").className=hints?"on":"";save();};
$("sndBtn").onclick=()=>{snd=!snd;$("sndBtn").className=snd?"on":"";if(snd)ac();save();};
$("hintBtn").className=hints?"on":"";
$("sndBtn").className=snd?"on":"";
buildGrads();syncDiveUI();updateInfo();renderRecs();resize();
requestAnimationFrame(loop);
</script>
</body>
