name: Сборка APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:        # позволяет запускать сборку вручную кнопкой

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Забрать исходники
        uses: actions/checkout@v4

      - name: Поставить JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Поставить Android SDK
        uses: android-actions/setup-android@v3

      - name: Подготовить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Собрать отладочный APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Переименовать по версии
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/diving-10m-$(date +%Y%m%d)-debug.apk"

      - name: Выложить APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: diving-10m-apk
          path: out/*.apk
          retention-days: 90
